meta:
  name: cq500_v8
  seed: 0
  device: cuda
init_ckpt: ${OUTPUT_ROOT}/stage2_backbone/latest.pt
mode: finetune
data:
  train_manifest: ${DATA_ROOT}/splits/cq500_train.csv
  val_manifest: ${DATA_ROOT}/splits/cq500_val.csv
  v_min: 2
  v_max: 16
  det_px: 512
  num_workers: 16
  hu_min: -1024.0
  hu_max: 1024.0
  fixed_v: 8
  fixed_pattern: uniform_circular
  fixed_sad_mm: 600.0
  fixed_sdd_ratio: 1.5
  fixed_elev_deg: 0.0
  fixed_det_pixel_mm: null
  crop_out_size: 256
  spacing_lo: 1.2
  spacing_hi: 1.2
  eval_spacing: 1.2
  batch_size: 3
fine:
  n_query: 16384
optim:
  lr: 0.0001
  weight_decay: 0.001
  layer_decay: 0.75
  iters: 44000
  min_lr: 1.0e-06
  grad_clip: 1.0
  epochs: 400
  warmup_epochs: 5
eval:
  out_res: 256
  chunk: 65536
  max_cts: 50
  eval_every_epochs: 20
ckpt:
  dir: ${OUTPUT_ROOT}/cq500_v8
  keep_latest: true
  resume: true
  save_every_epochs: 5
log:
  csv: ${OUTPUT_ROOT}/cq500_v8/log.csv
  print_every: 200
early_stop:
  enabled: true
  min_epochs: 120
  patience: 5
  min_delta: 0.02
final_eval:
  test_manifest: ${DATA_ROOT}/splits/cq500_test.csv
  checkpoint: best.pt
  metrics_csv: ${OUTPUT_ROOT}/cq500_v8/test_metrics.csv
