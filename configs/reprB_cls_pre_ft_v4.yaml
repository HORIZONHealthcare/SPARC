meta:
  name: reprB_cls_pre_ft_v4
  seed: 0
init_ckpt: ${OUTPUT_ROOT}/stage2_foundation/latest.pt
geom_config: configs/recon_ours_clssplit_converged_v4.yaml
mode: finetune
n_seeds: 3
data:
  train_manifest: ${DATA_ROOT}/splits/cls3039_train_zarr.csv
  val_manifest: ${DATA_ROOT}/splits/cls3039_val_zarr.csv
  test_manifest: ${DATA_ROOT}/splits/cls3039_test_zarr.csv
  label_csv: ${DATA_ROOT}/valid_predicted_labels.csv
  batch_size: 16
head:
  hidden: 512
optim:
  lr: 0.0001
  lr_head: 0.0001
  lr_enc: 1.0e-06
  lp_warmup_iters: 4000
  lp_lr: 0.001
  freeze_epochs: 1
  accum: 4
  weight_decay: 0.0001
  iters: 4000
  epochs: 6
ckpt:
  dir: ${OUTPUT_ROOT}/reprB_cls_pre_ft_v4
