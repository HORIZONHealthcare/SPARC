# Stage 2: unified sparse-view X-ray foundation model.
# ONE backbone: V X-rays -> 2D conv+transformer encoder -> project/fuse ->
# 3D transformer -> single feature volume F (16^3, aligned to the 256^3-patch16
# CT-MAE token grid). TWO heads on F: recon (voxel, MSE) + semantic (predict
# frozen CT-MAE tokens, smooth_l1). F is the transferable representation.
# DRR: center crop + random spacing (physically-valid whole-volume projection).

meta:
  name: stage2_backbone
  seed: 0
  device: cuda

data:
  manifest: ${DATA_ROOT}/splits/ctrate_pretrain.csv   # correct-HU zarr
  v_min: 2
  v_max: 16
  det_px: 512                 # high-res X-ray input
  batch_size: 1               # variable V -> 1/GPU (global batch = world_size)
  num_workers: 8
  hu_min: -1024.0
  hu_max: 1024.0
  crop_out_size: 256          # MUST equal frozen MAE vol_size
  spacing_lo: 1.0
  spacing_hi: 2.0
  center_crop: true           # whole-volume DRR (rays keep full thickness)

model:
  grid_res: 16                # F grid; == MAE vol/patch = 256/16

encoder2d:                    # per-view conv pyramid + coarse-scale transformer
  base_ch: 64
  n_stages: 4                 # 512 -> coarse 32^2 = 1024 tokens for the 2D tf
  ch_mult: 2
  blocks_per_stage: 2
  tf_dim: 768
  tf_depth: 6
  tf_heads: 12

volume3d:                     # 3D transformer over 16^3 = 4096 tokens
  dim: 768
  depth: 8
  num_heads: 12

fine:
  n_query: 16384
  pointdec_mlp: [512, 512, 256]

semantic:
  depth: 4
  heads: 12

loss:
  recon_loss: mse
  coarse_weight: 1.0
  fine_weight: 1.0

target:
  ctmae_init_path: ${OUTPUT_ROOT}/stage1_ctmae/ckpt_iter200000.pt

optim:
  # semantic head is V-JEPA-style -> keep LR small, no linear-scaling under DDP,
  # long warmup (3D-CT JEPA collapses under aggressive LR).
  lr: 1.0e-4
  weight_decay: 0.04
  iters: 150000
  warmup_iters: 4000
  min_lr: 1.0e-6

ckpt:
  save_every_iters: 5000
  keep_latest: true
  dir: ${OUTPUT_ROOT}/stage2_backbone

log:
  print_every: 100
  csv: ${OUTPUT_ROOT}/stage2_backbone/log.csv
